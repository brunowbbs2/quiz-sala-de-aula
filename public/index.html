<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0722" />
<title>Quiz IF — Entrar na sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css?v=15" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
<style>
  .jogo-topo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; font-weight: 700;
  }
  .jogo-topo .relogio { width: 54px; height: 54px; }
  .jogo-topo .relogio .numero { font-size: 20px; }
  #aluno-alternativas { grid-auto-rows: 1fr; padding: 0 12px 16px; }
  #aluno-alternativas .alt { justify-content: center; min-height: 0; }
  #aluno-alternativas .forma { width: 2.2em; height: 2.2em; }
  #aluno-alternativas .alt:active { transform: scale(0.97); }
  .icone-grande { font-size: 76px; line-height: 1; animation: surgir 0.35s ease both; }
  .icone-grande .forma { width: 88px; height: 88px; }
  .contagem-numero { font-size: 128px; font-weight: 800; line-height: 1; animation: surgir 0.4s ease both; }
  .placar-pessoal { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
  .placar-pessoal div { text-align: center; }
  .placar-pessoal strong { display: block; font-size: 30px; }
</style>
</head>
<body>

<!-- ENTRAR -->
<section id="tela-entrar" class="tela centralizada">
  <div class="marca">
    <span class="ponto"><svg viewBox="0 0 100 100" fill="#fff"><polygon points="50,10 93,84 7,84"/></svg></span>
    Quiz IF
  </div>
  <div class="cartao estreito coluna">
    <div class="campo">
      <label for="pin">PIN da sala</label>
      <input id="pin" inputmode="numeric" autocomplete="off" placeholder="000000" maxlength="6"
             style="font-size:30px;letter-spacing:8px;text-align:center;font-weight:800" />
    </div>
    <div class="campo">
      <label for="nome">Seu nome</label>
      <input id="nome" maxlength="18" autocomplete="off" placeholder="Como aparecer no placar" />
    </div>
    <button id="btn-entrar" class="btn grande" style="width:100%">Entrar</button>
    <div id="erro-entrar" class="erro"></div>
  </div>
  <p class="suave pequeno">A pergunta aparece no telão da sala.<br />Aqui você escolhe a resposta.</p>
  <a class="link-professor" href="/host">Sou o professor &rarr;</a>
</section>

<!-- LOBBY -->
<section id="tela-lobby" class="tela centralizada" hidden>
  <div class="icone-grande" id="lobby-avatar"></div>
  <h1 id="lobby-nome"></h1>
  <p class="suave">Você entrou em <b id="lobby-quiz"></b></p>
  <p class="suave pequeno">Olhe para o telão — a partida já vai começar.</p>
</section>

<!-- CONTAGEM -->
<section id="tela-contagem" class="tela centralizada" hidden>
  <p class="suave" id="contagem-info"></p>
  <div class="contagem-numero" id="contagem-numero">3</div>
  <h2>Prepare-se!</h2>
</section>

<!-- PERGUNTA: só as alternativas -->
<section id="tela-pergunta" class="tela" hidden>
  <div class="jogo-topo">
    <span id="aluno-contador" class="suave"></span>
    <div class="relogio" id="aluno-relogio"></div>
    <span id="aluno-pontos">0 pts</span>
  </div>
  <p class="suave pequeno" style="text-align:center;margin-bottom:10px">Toque na sua resposta</p>
  <div id="aluno-alternativas" class="alternativas crescer"></div>
</section>

<!-- ESPERA / RESULTADO -->
<section id="tela-status" class="tela centralizada" hidden>
  <div class="icone-grande" id="status-icone"></div>
  <h1 id="status-titulo"></h1>
  <p class="suave" id="status-texto"></p>
  <div class="placar-pessoal" id="status-placar" hidden>
    <div><strong id="status-pontos">0</strong><span class="suave pequeno">pontos</span></div>
    <div><strong id="status-posicao">-</strong><span class="suave pequeno">colocação</span></div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="js/ui.js?v=15"></script>
<script src="js/player.js?v=15"></script>
</body>
</html>
