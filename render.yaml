# Render: "New +" > "Blueprint" e aponte para este repositório.
# (Dá no mesmo criar um "Web Service" pela interface — o Render detecta Node sozinho.)
services:
  - type: web
    name: quiz-sala-de-aula
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false # defina no painel do Render
      - key: DATABASE_URL
        sync: false # a connection string do Neon, definida no painel do Render
